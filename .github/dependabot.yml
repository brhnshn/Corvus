version: 2
updates:
  # NuGet dependencies for .NET
  - package-ecosystem: "nuget"
    directory: "/src/Corvus.Api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "area:backend"

  # npm dependencies for Frontend
  - package-ecosystem: "npm"
    directory: "/src/Corvus.Web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "area:frontend"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "area:ci"
