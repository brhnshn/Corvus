name: CI / Test & Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    name: Backend .NET 9 Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore tests/Corvus.Api.Tests/Corvus.Api.Tests.csproj

      - name: Build and Test
        run: dotnet test tests/Corvus.Api.Tests/Corvus.Api.Tests.csproj --configuration Release --verbosity normal

  frontend-build:
    name: Frontend React Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/Corvus.Web/package-lock.json

      - name: Install Dependencies
        working-directory: src/Corvus.Web
        run: npm ci

      - name: Build Frontend
        working-directory: src/Corvus.Web
        run: npm run build

  docker-build:
    name: Full Docker Native AOT Image Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.repository == 'brhnshn/Corvus' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.repository == 'brhnshn/Corvus' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/brhnshn/corvus:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Server Deploy
    needs: docker-build
    # Fork'layanlarda veya PR'larda asla çalışmaz, sadece senin ana deponda çalışır:
    if: github.repository == 'brhnshn/Corvus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.DEPLOY_URL }}" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '${{ secrets.DEPLOY_PAYLOAD }}')
          echo "Deploy webhook triggered (HTTP status: $HTTP_STATUS)"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::Deploy webhook returned status $HTTP_STATUS"
            exit 1
          fi
